plugins { id 'com.android.application' }

android {
    namespace 'app.kabellink'
    compileSdk 34
    defaultConfig {
        applicationId 'app.kabellink'
        minSdk 26        // Galaxy A12: Android 10 ke atas
        targetSdk 33     // 33 = tidak wajib deklarasi tipe foreground service
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
